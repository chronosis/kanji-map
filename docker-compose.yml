services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - kanji-map-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/kanji-map.sqlite
      - HOST=0.0.0.0
      - PORT=3000

volumes:
  kanji-map-data:
